# pytest reads its settings from the [pytest] section of this file
[pytest]

# Only look for tests inside the tests folder
testpaths = tests

# Add the project root to Python's import path so "from pages..." works in tests
pythonpath = .

# Options added to every run: write the HTML report to reports/report.html,
# with CSS and JS embedded so it is a single file you can share
addopts = --html=reports/report.html --self-contained-html
